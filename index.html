<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101116">
  <meta name="description" content="Find your next visual spark with PixelPulse, powered by Wikimedia Commons.">
  <title>PixelPulse — find your visual spark</title>
  <link rel="preconnect" href="https://upload.wikimedia.org">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#top" aria-label="PixelPulse home"><span class="brand-mark">✳</span> pixel<span>pulse</span></a>
    <span class="top-note"><span class="status-dot"></span> A little inspiration, on demand</span>
  </header>

  <main id="top">
    <section class="hero" aria-labelledby="hero-title">
      <p class="eyebrow"><span>✦</span> YOUR VISUAL DISCOVERY TOOL</p>
      <h1 id="hero-title">Ideas have a<br><span class="gradient-text">look.</span></h1>
      <p class="intro">Follow a thought. Find the image. Let your next idea take shape.</p>
      <form id="search-form" class="search-form" role="search">
        <label class="sr-only" for="search-input">Search images</label>
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="search-input" name="query" type="search" placeholder="Try “quiet mornings” or “deep sea”" autocomplete="off" required>
        <button type="submit"><span>Search</span><span aria-hidden="true">↗</span></button>
      </form>
      <div class="suggestions" aria-label="Try a search">
        <span>TRY</span><button type="button" data-query="japanese gardens">Japanese gardens</button>
        <button type="button" data-query="space photography">Space photography</button>
        <button type="button" data-query="wildflowers">Wildflowers</button>
      </div>
    </section>

    <section class="results-section" aria-label="Image results">
      <div class="results-heading">
        <div><p class="eyebrow" id="results-kicker">THE CANVAS IS YOURS</p><h2 id="results-title">Start with a search</h2></div>
        <p id="result-count" class="result-count" aria-live="polite"></p>
      </div>
      <p id="status-message" class="status-message" role="status">A whole world of images is one search away.</p>
      <div id="results-grid" class="results-grid"></div>
    </section>
  </main>
  <footer><span>PIXELPULSE</span><span>Images from Wikimedia Commons</span></footer>
</body>
</html>
